[package]
name = "lucid-sentence"
version = "0.1.5-preview"
description = "Lucid Sentence installable preview"
authors = ["Lucid Systems and the Lucid Sentence contributors"]
license = "AGPL-3.0-only"
repository = "https://github.com/DoctorNurse/Lucid-Sentence"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (Tauri's template convention).
name = "lucid_sentence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# File > Open / Save / Save As: native dialogs (the document picker on Android)
# and reading/writing the picked files (paths on desktop, content:// URIs on Android).
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Needed by `tauri::generate_context!` once tauri.conf.json has a `plugins` section.
serde_json = "1"
serde = { version = "1", features = ["derive"] }

# Desktop auto-update (signed latest.json; see apps/shell/README.md). Tauri's updater
# doesn't run on Android or iOS: Android checks GitHub Releases from the web app instead.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# On-device AI: llama.cpp runtime, verified model downloads, and the local MCP server
# (packages/ai/native). 32-bit Arm Android builds skip llama.cpp: those devices are below
# the 8 GB floor, and the app falls back to the web runtime there.
[target.'cfg(not(target_arch = "arm"))'.dependencies]
lucid-ai = { path = "../../../packages/ai/native" }

[target.'cfg(target_arch = "arm")'.dependencies]
lucid-ai = { path = "../../../packages/ai/native", default-features = false }
