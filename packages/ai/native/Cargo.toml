[package]
name = "lucid-ai"
version = "0.1.0"
description = "Lucid Sentence on-device AI: llama.cpp runtime, resumable model downloads, and the local MCP server"
authors = ["Lucid Systems and the Lucid Sentence contributors"]
license = "AGPL-3.0-only"
repository = "https://github.com/DoctorNurse/Lucid-Sentence"
edition = "2021"
rust-version = "1.80"
publish = false

[features]
default = ["llama"]
# The llama.cpp runtime (GGUF). Without it the crate still builds: downloads and the
# MCP server work, and `Engine::load` reports that the native runtime is unavailable.
llama = ["dep:llama-cpp-2"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.2"
base64 = "0.22"
# Model downloads (rustls; no OpenSSL to link on Android).
ureq = { version = "2", default-features = false, features = ["tls"] }
# Pinned: llama.cpp moves fast and model support (qwen35) depends on the bundled build.
# No default features: no OpenMP (not on Android/macOS clang), no libc++_shared.so to ship.
llama-cpp-2 = { version = "=0.1.159", optional = true, default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
llama-cpp-2 = { version = "=0.1.159", optional = true, default-features = false, features = ["android-static-stdcxx"] }


[[bin]]
name = "lucid-ai-bench"
path = "src/bin/bench.rs"
required-features = ["llama"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_SystemInformation"] }

# Desktop only: the MCP key hashes live in the OS keystore (Keychain, Credential Manager,
# kernel keyutils on Linux). Mobile has no MCP listener in v1 (plan §9.7).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native"] }
