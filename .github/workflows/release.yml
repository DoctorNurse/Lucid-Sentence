name: Release

# Builds the installable preview for every platform.
# - A pushed tag v* (for example v0.1.0-preview) builds everything and publishes
#   a GitHub Release with auto-generated notes and the installers attached.
# - "Run workflow" (manual) and pull requests that touch the app shell build
#   everything and keep the installers as workflow artifacts only (no release).
# Code signing and notarization run only when the matching secrets exist; without
# them the build still succeeds and produces unsigned installers.
# Desktop auto-update: with TAURI_SIGNING_PRIVATE_KEY set, the build also produces
# signed updater files (.sig), and the release gets a latest.json that the apps read
# from GitHub Pages (pages.yml copies it there after each release).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - apps/shell/**
      - apps/demo/**
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          - name: Windows x64
            os: windows-latest
            rust-targets: ''
            args: --bundles msi,nsis
          - name: Linux x86_64
            # The oldest supported runner, so the AppImage and .deb run on older distributions too.
            os: ubuntu-22.04
            rust-targets: ''
            args: --bundles appimage,deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
      HAS_APPLE_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/shell/src-tauri -> target
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Shell checks (format, clippy, unit tests)
        if: runner.os == 'Linux'
        working-directory: apps/shell/src-tauri
        run: |
          # The shell embeds the built web app at compile time.
          pnpm -w run build
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      # ── macOS signing (optional) ─────────────────────────────────────────
      - name: Import the Developer ID certificate
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Add the signing keychain to the search list, keeping the existing ones.
          EXISTING=()
          while IFS= read -r k; do EXISTING+=("$k"); done < <(security list-keychains -d user | tr -d '" ')
          security list-keychains -d user -s "$KEYCHAIN" "${EXISTING[@]}"
          rm "$RUNNER_TEMP/certificate.p12"
          IDENTITY="$APPLE_SIGNING_IDENTITY"
          if [ -z "$IDENTITY" ]; then
            # Derive it from the certificate: the first "Developer ID Application" identity.
            IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application[^"]*"' | head -n 1 | tr -d '"')"
          fi
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in APPLE_CERTIFICATE."
            exit 1
          fi
          echo "Signing identity: $IDENTITY"
          echo "MAC_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Note unsigned macOS build
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT != 'true'
        run: echo "::notice::APPLE_CERTIFICATE is not set, so the macOS app is ad-hoc signed and not notarized."

      # ── Windows signing (optional) ───────────────────────────────────────
      - name: Import the Windows code-signing certificate
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'certificate.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          "WINDOWS_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Note unsigned Windows build
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT != 'true'
        run: echo "::notice::WINDOWS_CERTIFICATE is not set, so the Windows installers are unsigned (SmartScreen will warn)."

      - name: Build the app
        env:
          APPLE_ID: ${{ env.HAS_APPLE_CERT == 'true' && env.HAS_APPLE_NOTARY == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ env.HAS_APPLE_CERT == 'true' && env.HAS_APPLE_NOTARY == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.HAS_APPLE_CERT == 'true' && env.HAS_APPLE_NOTARY == 'true' && secrets.APPLE_TEAM_ID || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Empty notarization variables would make Tauri try (and fail) to notarize.
          [ -n "$APPLE_ID" ] || unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          if [ "$HAS_UPDATER_KEY" != "true" ]; then
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            echo "::notice::TAURI_SIGNING_PRIVATE_KEY is not set, so no updater files are built (the apps won't auto-update)."
          fi
          CONFIG="$(node -e '
            const c = { bundle: { createUpdaterArtifacts: process.env.HAS_UPDATER_KEY === "true" } };
            if (process.env.RUNNER_OS === "macOS") c.bundle.macOS = { signingIdentity: process.env.MAC_SIGNING_IDENTITY || "-" };
            else if (process.env.WINDOWS_THUMBPRINT) c.bundle.windows = { certificateThumbprint: process.env.WINDOWS_THUMBPRINT.trim(), digestAlgorithm: "sha256", timestampUrl: "http://timestamp.digicert.com" };
            console.log(JSON.stringify(c));
          ')"
          pnpm --filter @lucid-sentence/shell exec tauri build ${{ matrix.args }} --config "$CONFIG"

      - name: Sign, notarize, and staple the .dmg
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG="$(find apps/shell/src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -n 1)"
          codesign --force --timestamp --sign "$MAC_SIGNING_IDENTITY" "$DMG"
          if [ "$HAS_APPLE_NOTARY" = "true" ]; then
            xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$DMG"
            xcrun stapler validate "$DMG"
            spctl --assess --type open --context context:primary-signature -v "$DMG"
          else
            echo "::notice::APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID are not all set, so the .dmg is signed but not notarized."
          fi

      - name: Collect installers
        run: |
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          B=apps/shell/src-tauri/target
          # Copy the first file matching a pattern, under a stable name (for download links).
          take() {
            f="$(find "$1" -maxdepth 1 -name "$2" | head -n 1)"
            [ -n "$f" ] || { echo "::error::No $2 in $1"; exit 1; }
            cp "$f" "$OUT/$3"
          }
          # Updater files: an installer's signature (.sig), and on macOS the app archive.
          # The signature covers the file's bytes, so renaming is safe.
          upd() { [ "$HAS_UPDATER_KEY" = "true" ] && take "$@"; return 0; }
          case "$RUNNER_OS" in
            macOS)
              M="$B/universal-apple-darwin/release/bundle"
              take "$M/dmg" '*.dmg' Lucid-Sentence-macOS.dmg
              upd "$M/macos" '*.app.tar.gz' Lucid-Sentence-macOS.app.tar.gz
              upd "$M/macos" '*.app.tar.gz.sig' Lucid-Sentence-macOS.app.tar.gz.sig ;;
            Windows)
              take "$B/release/bundle/msi" '*.msi' Lucid-Sentence-Windows.msi
              take "$B/release/bundle/nsis" '*-setup.exe' Lucid-Sentence-Windows-Setup.exe
              upd "$B/release/bundle/msi" '*.msi.sig' Lucid-Sentence-Windows.msi.sig
              upd "$B/release/bundle/nsis" '*-setup.exe.sig' Lucid-Sentence-Windows-Setup.exe.sig ;;
            Linux)
              take "$B/release/bundle/appimage" '*.AppImage' Lucid-Sentence-Linux.AppImage
              take "$B/release/bundle/deb" '*.deb' Lucid-Sentence-Linux.deb
              upd "$B/release/bundle/appimage" '*.AppImage.sig' Lucid-Sentence-Linux.AppImage.sig
              upd "$B/release/bundle/deb" '*.deb.sig' Lucid-Sentence-Linux.deb.sig ;;
          esac
          ls -la "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    env:
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' }}
      NDK_VERSION: 27.2.12479018
      BUILD_TOOLS: 35.0.0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # The action's default list includes the retired "tools" package, which now fails.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install the Android SDK packages
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;$BUILD_TOOLS" "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/shell/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Generate the Android project and apply the brand icons
        run: |
          pnpm --filter @lucid-sentence/shell exec tauri android init --ci
          RES=apps/shell/src-tauri/gen/android/app/src/main/res
          cp -R apps/mobile/android-res/mipmap-* "$RES/"
      - name: Build the APK
        run: pnpm --filter @lucid-sentence/shell exec tauri android build --apk
      - name: Sign the APK
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          UNSIGNED="$(find apps/shell/src-tauri/gen/android/app/build/outputs/apk -name '*-unsigned.apk' | head -n 1)"
          KS="$RUNNER_TEMP/release.keystore"
          if [ "$HAS_ANDROID_KEYSTORE" = "true" ]; then
            echo "$ANDROID_KEYSTORE" | base64 --decode > "$KS"
            STOREPASS="$ANDROID_KEYSTORE_PASSWORD"; ALIAS="$ANDROID_KEY_ALIAS"
            KEYPASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          else
            # No release key in the repository secrets: sign with a throwaway key so the
            # APK installs. Updates then need an uninstall first (see apps/shell/README.md).
            echo "::notice::ANDROID_KEYSTORE is not set, so the APK is signed with a temporary key."
            STOREPASS="$(openssl rand -hex 16)"; KEYPASS="$STOREPASS"; ALIAS=preview
            keytool -genkeypair -keystore "$KS" -storepass "$STOREPASS" -keypass "$KEYPASS" -alias "$ALIAS" \
              -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=Lucid Sentence preview" > /dev/null
          fi
          mkdir -p "$RUNNER_TEMP/out"
          "$TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" sign --ks "$KS" --ks-pass "pass:$STOREPASS" --key-pass "pass:$KEYPASS" --ks-key-alias "$ALIAS" \
            --out "$RUNNER_TEMP/out/Lucid-Sentence-Android.apk" "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" verify --print-certs "$RUNNER_TEMP/out/Lucid-Sentence-Android.apk"
          rm -f "$KS"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-Android
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Starts the Pages deploy that publishes latest.json for the desktop updater.
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true
      - name: Updater manifest (latest.json)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ls dist/*.sig > /dev/null 2>&1; then
            node scripts/updater-manifest.mjs "$TAG" dist "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" > dist/latest.json
            cat dist/latest.json
          else
            echo "::notice::No updater signatures, so no latest.json (the desktop apps won't see this release as an update)."
          fi
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          **Preview build for testing.** Lucid Sentence runs the editor UI on a sample page. Opening and saving your own `.docx` files arrive when the document engine is wired in.

          These installers are **not code-signed yet**, so your system will warn the first time you open them:

          - **macOS** (`Lucid-Sentence-macOS.dmg`, Apple silicon and Intel): drag the app to Applications, then right-click it and choose **Open**, then **Open** again. On macOS 15 and later, if that doesn't offer Open: try once, then go to **System Settings → Privacy & Security** and click **Open Anyway**.
          - **Windows** (`Lucid-Sentence-Windows-Setup.exe` or `.msi`): if SmartScreen says "Windows protected your PC", click **More info**, then **Run anyway**.
          - **Android** (`Lucid-Sentence-Android.apk`): when asked, allow your browser or Files app to **install unknown apps**, then tap **Install**.
          - **Linux**: make `Lucid-Sentence-Linux.AppImage` executable and run it, or install the `.deb`.
          - **iPhone and iPad**: open the web app in Safari and choose **Add to Home Screen** (see the README).

          **Updates.** From v0.1.1-preview on, the desktop apps check for updates on launch and offer **Restart to update** (updates are signed and verified before they install). The Android app checks GitHub Releases on launch and offers to download the new APK; Android APKs are now signed with a permanent release key, so later versions install over this one. If you have v0.1.0-preview installed (Android or desktop), install this version by hand once: on Android, uninstall v0.1.0-preview first, because it was signed with a temporary key. The home-screen web app offers **Reload for new version** when one is ready.

          Checksums are in `SHA256SUMS.txt`. Full install steps: [README → Download](https://github.com/DoctorNurse/Lucid-Sentence#download).
          NOTES
          # Versions with a pre-release part (v0.1.0-preview) are published as pre-releases.
          PRERELEASE=()
          case "$TAG" in *-*) PRERELEASE=(--prerelease) ;; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag "${PRERELEASE[@]}" \
            --title "Lucid Sentence ${TAG#v}" --notes-file notes.md --generate-notes
      - name: Publish the update feed on GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
